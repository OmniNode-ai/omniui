#
# OMN-16885 (Phase 1A.1): the real build + test surface for omniui.
# Public repo -- GitHub-hosted runners only (project_public_repos_use_github_hosted_runners).
# Do not add a self-hosted runner label to this workflow.
#
# NEVER RENAME THE JOB IDS `build` AND `test`. Branch protection on `main`
# pins its required status checks to exactly those two contexts; renaming a
# job silently removes its gate rather than failing loudly.
#
# That pinning is also why lint and typecheck run INSIDE `build` rather than
# as sibling jobs. A third job would be a check nobody is required to pass,
# and Operating Rule #5 is explicit that detection without enforcement gets
# ignored. Folding them into a required context makes them blocking on the
# branch-protection surface that already exists.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

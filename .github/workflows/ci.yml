#
# OMN-16879: build + test skeleton for the omniui component library.
# Public repo -- GitHub-hosted runners only (project_public_repos_use_github_hosted_runners).
# Do not add a self-hosted runner label to this workflow, and never rename
# the job ids below -- branch protection will pin required status checks to
# them once this run goes green.
#
# This is a scaffold-phase placeholder: `build`/`test` are no-ops until
# Phase 1A (OMN-16879) lands the real package, token-compile pipeline, and
# the scoped lint gates from plan section 2.3.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

#
# OMN-16887 / D2b: publish-on-release to public npm with provenance.
# Public repo -- GitHub-hosted runners only.
#
# D2b ruling (2026-08-28): the Plane-2 code artifact (this library) reaches
# every consumer as an immutable, exact-pinned, provenance-attested public
# npm package. `--provenance` requires npm >= 9.5 and the `id-token: write`
# permission below (OIDC), which is how npm verifies this build ran in this
# repo's own Actions workflow rather than being hand-uploaded.
#
# Runners are hardcoded ubuntu-latest ON PURPOSE. Do not port omnibase_core's
# OMNI_TRUSTED_CI_RUNS_ON_JSON selector here -- omniui is public and public
# repos use GitHub-hosted runners (project_public_repos_use_github_hosted_runners).
#
# Publishing is RELEASE-TRIGGERED, not push-to-main. An immutable artifact needs
# an explicit, named release event; "every merge publishes" makes the version
# number a side effect of merge order.
#
# BLOCKED, and deliberately so: `package.json` still ships `"private": true`,
# and `npm publish` refuses a private package. That refusal is the gate, not a
# bug. It lifts when the two operator prerequisites in
# `docs/PLANE-2-DISTRIBUTION.md` are met -- the `@omninode` npm scope does not
# exist and no publish credential is provisioned, and an agent can create
# neither.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and attest without publishing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # REQUIRED for npm provenance. Without it --provenance fails.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The release tag is the authority on the version. A package published
      # under a number that does not match its tag makes rollback-by-pin
      # unverifiable: two different bytes can then answer to one version.
      - name: Assert release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi
          echo "version=${pkg_version}" >> "$GITHUB_ENV"

      # Fail closed rather than let npm's default-access behaviour decide.
      # Stall 1 was literally a package with no publishConfig at all, so
      # asserting it is cheap insurance against the exact original failure.
      - name: Assert package is publicly publishable
        run: |
          set -euo pipefail
          access="$(node -p "require('./package.json').publishConfig?.access ?? ''")"
          if [ "$access" != "public" ]; then
            echo "::error::package.json must declare publishConfig.access=public"
            exit 1
          fi

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --provenance --access public --dry-run

      - name: Publish with provenance
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: npm publish --provenance --access public

      # Read the artifact back from the registry rather than trusting the
      # publish step's exit code (feedback_verify_the_claim_not_just_the_fix).
      # The registry can lag a publish by up to about a minute, hence the retry.
      - name: Read back published version, integrity, and shasum
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          for i in 1 2 3 4 5 6; do
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              break
            fi
            echo "registry not yet consistent, retry ${i}"
            sleep 10
          done
          {
            echo "### Published \`${name}@${version}\`"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| integrity | \`$(npm view "${name}@${version}" dist.integrity)\` |"
            echo "| shasum | \`$(npm view "${name}@${version}" dist.shasum)\` |"
            echo "| tarball | $(npm view "${name}@${version}" dist.tarball) |"
            echo ""
            echo "Verify reachability from outside this workspace:"
            echo ""
            echo "\`\`\`"
            echo "scripts/verify-reachability.sh ${name} ${version} <prior-version>"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
